"""
Operations contract (CU06, CU07, CU08, CU09, CU10). Extends the employees schema executed by
integration/bff; every root field declares the permission required by the CU02 catalog.
"""
enum CustomerStatus {
  active
  inactive
}
enum VehicleStatus {
  active
  inactive
}
enum FuelType {
  gasolina
  diesel
  gas
  electrico
  hibrido
}
enum ServiceCategory {
  mantenimiento
  reparacion
  diagnostico
  otros
}
enum AppointmentStatus {
  scheduled
  cancelled
}

type Customer {
  id: UUID!
  firstName: String!
  lastName: String!
  document: String!
  phone: String!
  email: String
  address: String
  status: CustomerStatus!
  version: Int!
  createdAt: DateTime!
  updatedAt: DateTime!
}
type CustomerPage {
  items: [Customer!]!
  total: Int!
  limit: Int!
  offset: Int!
}

type Vehicle {
  id: UUID!
  customerId: UUID!
  customerName: String!
  plate: String!
  make: String!
  model: String!
  year: Int!
  fuelType: FuelType!
  color: String
  status: VehicleStatus!
  version: Int!
  createdAt: DateTime!
  updatedAt: DateTime!
}
type VehiclePage {
  items: [Vehicle!]!
  total: Int!
  limit: Int!
  offset: Int!
}

type Service {
  id: UUID!
  name: String!
  description: String!
  category: ServiceCategory!
  estimatedMinutes: Int!
  referenceRate: Float!
  active: Boolean!
  version: Int!
  createdAt: DateTime!
  updatedAt: DateTime!
}
type ServicePage {
  items: [Service!]!
  total: Int!
  limit: Int!
  offset: Int!
}

"""
A reserved slot for a vehicle and a service. It is not a work order nor a mechanic assignment.
"""
type Appointment {
  id: UUID!
  customerId: UUID!
  customerName: String!
  vehicleId: UUID!
  vehiclePlate: String!
  serviceId: UUID!
  serviceName: String!
  startsAt: DateTime!
  endsAt: DateTime!
  status: AppointmentStatus!
  notes: String
  cancelReason: String
  version: Int!
  createdAt: DateTime!
  updatedAt: DateTime!
}
type AppointmentPage {
  items: [Appointment!]!
  total: Int!
  limit: Int!
  offset: Int!
}
enum AppointmentRequestStatus {
  PENDING_REVIEW
  APPROVED
  REJECTED
}
type AppointmentRequest {
  id: UUID!
  operationId: UUID!
  clientId: String!
  customerId: UUID!
  vehicleId: UUID!
  serviceId: UUID!
  requestedStartsAt: DateTime!
  timeZone: String!
  notes: String
  status: AppointmentRequestStatus!
  createdAt: DateTime!
  reviewedAt: DateTime
  reviewerSubject: String
  reviewReason: String
  appointmentId: UUID
  version: Int!
}
type AppointmentRequestPage {
  items: [AppointmentRequest!]!
  total: Int!
  limit: Int!
  offset: Int!
}

type CustomerResult {
  customer: Customer!
  replayed: Boolean!
}
type VehicleResult {
  vehicle: Vehicle!
  replayed: Boolean!
}
type ServiceResult {
  service: Service!
  replayed: Boolean!
}
type AppointmentResult {
  appointment: Appointment!
  replayed: Boolean!
}
type AppointmentRequestResult {
  request: AppointmentRequest!
  replayed: Boolean!
}

input CreateCustomerInput {
  operationId: UUID!
  firstName: String!
  lastName: String!
  document: String!
  phone: String!
  email: String
  address: String
}
input UpdateCustomerInput {
  operationId: UUID!
  expectedVersion: Int!
  firstName: String!
  lastName: String!
  document: String!
  phone: String!
  email: String
  address: String
}
input CreateVehicleInput {
  operationId: UUID!
  customerId: UUID!
  plate: String!
  make: String!
  model: String!
  year: Int!
  fuelType: FuelType!
  color: String
}
input UpdateVehicleInput {
  operationId: UUID!
  expectedVersion: Int!
  customerId: UUID!
  plate: String!
  make: String!
  model: String!
  year: Int!
  fuelType: FuelType!
  color: String
}
input CreateServiceInput {
  operationId: UUID!
  name: String!
  description: String!
  category: ServiceCategory!
  estimatedMinutes: Int!
  referenceRate: Float!
}
input UpdateServiceInput {
  operationId: UUID!
  expectedVersion: Int!
  name: String!
  description: String!
  category: ServiceCategory!
  estimatedMinutes: Int!
  referenceRate: Float!
}
input CreateAppointmentInput {
  operationId: UUID!
  customerId: UUID!
  vehicleId: UUID!
  serviceId: UUID!
  startsAt: DateTime!
  notes: String
}
input RescheduleAppointmentInput {
  operationId: UUID!
  expectedVersion: Int!
  startsAt: DateTime!
  notes: String
}
input CancelAppointmentInput {
  operationId: UUID!
  expectedVersion: Int!
  reason: String!
}
input ApproveAppointmentRequestInput {
  startsAt: DateTime!
}
input RejectAppointmentRequestInput {
  reason: String!
}
input OperationsCommandInput {
  operationId: UUID!
  expectedVersion: Int!
}

extend type Query {
  customers(
    limit: Int
    offset: Int
    status: CustomerStatus
    search: String
  ): CustomerPage!
  customer(id: UUID!): Customer!
  vehicles(
    limit: Int
    offset: Int
    status: VehicleStatus
    customerId: UUID
    search: String
  ): VehiclePage!
  vehicle(id: UUID!): Vehicle!
  services(
    limit: Int
    offset: Int
    active: Boolean
    search: String
  ): ServicePage!
  service(id: UUID!): Service!
  appointments(
    limit: Int
    offset: Int
    from: DateTime
    to: DateTime
    status: AppointmentStatus
    customerId: UUID
    vehicleId: UUID
  ): AppointmentPage!
  appointment(id: UUID!): Appointment!
  appointmentRequests(limit: Int, offset: Int): AppointmentRequestPage!
}

extend type Mutation {
  createCustomer(input: CreateCustomerInput!): CustomerResult!
  updateCustomer(id: UUID!, input: UpdateCustomerInput!): CustomerResult!
  deactivateCustomer(id: UUID!, input: OperationsCommandInput!): CustomerResult!
  createVehicle(input: CreateVehicleInput!): VehicleResult!
  updateVehicle(id: UUID!, input: UpdateVehicleInput!): VehicleResult!
  deactivateVehicle(id: UUID!, input: OperationsCommandInput!): VehicleResult!
  createService(input: CreateServiceInput!): ServiceResult!
  updateService(id: UUID!, input: UpdateServiceInput!): ServiceResult!
  deactivateService(id: UUID!, input: OperationsCommandInput!): ServiceResult!
  createAppointment(input: CreateAppointmentInput!): AppointmentResult!
  rescheduleAppointment(
    id: UUID!
    input: RescheduleAppointmentInput!
  ): AppointmentResult!
  cancelAppointment(
    id: UUID!
    input: CancelAppointmentInput!
  ): AppointmentResult!
  approveAppointmentRequest(
    operationId: UUID!
    input: ApproveAppointmentRequestInput!
  ): AppointmentRequestResult!
  rejectAppointmentRequest(
    operationId: UUID!
    input: RejectAppointmentRequestInput!
  ): AppointmentRequestResult!
}

"""
CU11 reception and visual inspection. Not a work order.
"""
type Reception {
  id: UUID!
  vehicleId: UUID!
  vehiclePlate: String!
  customerId: UUID!
  customerName: String!
  appointmentId: UUID
  mileage: Int!
  reason: String!
  symptoms: String
  visibleConditions: String
  hasOrder: Boolean!
  receivedAt: DateTime!
  version: Int!
}
type ReceptionPage {
  items: [Reception!]!
  total: Int!
  limit: Int!
  offset: Int!
}

enum OrderPriority {
  baja
  normal
  alta
  urgente
}
enum WorkOrderStatus {
  pending_quote
  quote_requested
  quote_approved
  cancelled
  confirmation_pending
  confirmed
  completed
}

type WorkOrderItem {
  serviceId: UUID!
  serviceName: String!
  quantity: Int!
  estimatedMinutes: Int!
  referenceRate: Float!
}
"""
CU12 work order. It starts pending quotation and never assigns a mechanic.
"""
type WorkOrder {
  id: UUID!
  number: String!
  receptionId: UUID!
  vehicleId: UUID!
  vehiclePlate: String!
  customerId: UUID!
  customerName: String!
  description: String!
  priority: OrderPriority!
  notes: String
  status: WorkOrderStatus!
  version: Int!
  createdAt: DateTime!
  updatedAt: DateTime!
  items: [WorkOrderItem!]!
}
type WorkOrderPage {
  items: [WorkOrder!]!
  total: Int!
  limit: Int!
  offset: Int!
}
type RecordedService {
  id: UUID!
  recordedName: String!
  quantity: Int!
  minutes: Int!
}
type ServiceHistoryEvidence {
  id: UUID!
  fileName: String!
  contentType: String!
  sizeBytes: Int!
  createdAt: DateTime!
}
type VehicleServiceHistoryEntry {
  orderId: UUID!
  orderNumber: String!
  servicedAt: DateTime!
  type: String!
  status: WorkOrderStatus!
  description: String!
  observations: String!
  receptionReason: String!
  symptoms: String
  services: [RecordedService!]!
  evidences: [ServiceHistoryEvidence!]!
}
type VehicleServiceHistoryPage {
  items: [VehicleServiceHistoryEntry!]!
  total: Int!
  limit: Int!
  offset: Int!
}
type VehicleHistoryVehicle {
  id: UUID!
  plate: String!
  make: String!
  model: String!
  year: Int!
}
type VehicleHistoryVehiclePage {
  items: [VehicleHistoryVehicle!]!
  total: Int!
  limit: Int!
  offset: Int!
}

type ReceptionResult {
  reception: Reception!
  replayed: Boolean!
}
type WorkOrderResult {
  order: WorkOrder!
  replayed: Boolean!
}

input CreateReceptionInput {
  operationId: UUID!
  vehicleId: UUID!
  appointmentId: UUID
  mileage: Int!
  reason: String!
  symptoms: String
  visibleConditions: String
}
input RequestedServiceInput {
  serviceId: UUID!
  quantity: Int
}
input CreateWorkOrderInput {
  operationId: UUID!
  receptionId: UUID!
  description: String!
  priority: OrderPriority!
  notes: String
  services: [RequestedServiceInput!]!
}

extend type Query {
  vehicleHistoryVehicles(
    search: String!
    limit: Int
    offset: Int
  ): VehicleHistoryVehiclePage!
  vehicleServiceHistory(
    vehicleId: UUID!
    limit: Int
    offset: Int
  ): VehicleServiceHistoryPage!
  vehicleServiceHistoryEntry(
    vehicleId: UUID!
    orderId: UUID!
  ): VehicleServiceHistoryEntry!
  receptions(
    limit: Int
    offset: Int
    vehicleId: UUID
    open: Boolean
  ): ReceptionPage!
  reception(id: UUID!): Reception!
  orders(
    limit: Int
    offset: Int
    status: WorkOrderStatus
    customerId: UUID
    vehicleId: UUID
  ): WorkOrderPage!
  order(id: UUID!): WorkOrder!
}

extend type Mutation {
  createReception(input: CreateReceptionInput!): ReceptionResult!
  createWorkOrder(input: CreateWorkOrderInput!): WorkOrderResult!
}
