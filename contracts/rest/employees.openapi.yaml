openapi: "3.1.0"
info:
  title: "AutoNexus CU03 Employees REST contract"
  version: "1.0.0"
  description: "Early public contract from approved cu03-employees spec S2.2-S2.5; not evidence of implementation. MS02 owns PostgreSQL. ALL operations require administrador. REST is for authorized internal/mobile integrations, never direct web business access; future web BFF uses GraphQL. Trim/collapse whitespace in text fields before length/uniqueness checks; email comparison is case-insensitive. Reject wrong types, null input fields and unknown properties at every level. Dates use UTC. See ../auth/employees.md for idempotency, version, history and identity semantics."
security:
  -
    bearer: []
paths:
  "/employees":
    get:
      operationId: "listEmployees"
      summary: "List employees ordered by createdAt ASC, id ASC"
      x-required-role: "administrador"
      parameters:
        -
          name: "limit"
          in: "query"
          required: false
          schema:
            type: "integer"
            minimum: 1
            maximum: 100
            default: 20
          description: "Maximum items."
        -
          name: "offset"
          in: "query"
          required: false
          schema:
            type: "integer"
            minimum: 0
            maximum: 2147483647
            default: 0
          description: "Zero-based offset."
        -
          name: "status"
          in: "query"
          required: false
          schema:
            type: "string"
            enum:
              - "active"
              - "inactive"
          description: "Omitted includes both statuses."
        -
          name: "search"
          in: "query"
          required: false
          schema:
            type: "string"
            maxLength: 100
          description: "Trim/collapse whitespace; case-insensitive literal substring match on firstName, lastName, joined full name or normalized document; empty means no filter. Not a regex. total counts all matching rows before pagination."
      responses:
        "200":
          description: "Success; access synchronization does not roll back saved employment data."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/EmployeePage"
        "400":
          description: "Invalid input: VALIDATION_ERROR. No coercion or unknown properties."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/BusinessError"
        "401":
          description: "Missing or invalid session; existing guard shape has no code."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/GuardError"
        "403":
          description: "Valid session without administrador; existing guard shape has no code."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/GuardError"
        "503":
          description: "PERSISTENCE_UNAVAILABLE; never use this to report an IdP failure after the employee was saved."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/BusinessError"
    post:
      operationId: "createEmployee"
      summary: "Create active employee and optional durable identity intent"
      x-required-role: "administrador"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/CreateEmployee"
      responses:
        "201":
          description: "Employee saved active; access may still be pending/failed/conflict. Replays also return 201."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/EmployeeMutationResult"
        "400":
          description: "Invalid input: VALIDATION_ERROR. No coercion or unknown properties."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/BusinessError"
        "401":
          description: "Missing or invalid session; existing guard shape has no code."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/GuardError"
        "403":
          description: "Valid session without administrador; existing guard shape has no code."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/GuardError"
        "409":
          description: "Duplicate, stale version, reused operationId with different command, prohibited self-deactivation, access revocation or retry without requested access. See auth/employees.md."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/BusinessError"
        "503":
          description: "PERSISTENCE_UNAVAILABLE; never use this to report an IdP failure after the employee was saved."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/BusinessError"
  "/employees/{id}":
    parameters:
      -
        name: "id"
        in: "path"
        required: true
        schema:
          type: "string"
          format: "uuid"
    get:
      operationId: "getEmployee"
      summary: "Read one employee"
      x-required-role: "administrador"
      responses:
        "200":
          description: "Success; access synchronization does not roll back saved employment data."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Employee"
        "400":
          description: "Invalid input: VALIDATION_ERROR. No coercion or unknown properties."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/BusinessError"
        "401":
          description: "Missing or invalid session; existing guard shape has no code."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/GuardError"
        "403":
          description: "Valid session without administrador; existing guard shape has no code."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/GuardError"
        "404":
          description: "EMPLOYEE_NOT_FOUND."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/BusinessError"
        "503":
          description: "PERSISTENCE_UNAVAILABLE; never use this to report an IdP failure after the employee was saved."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/BusinessError"
    put:
      operationId: "updateEmployee"
      summary: "Replace all editable fields; never set employment status"
      x-required-role: "administrador"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/UpdateEmployee"
      responses:
        "200":
          description: "Success; access synchronization does not roll back saved employment data."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/EmployeeMutationResult"
        "400":
          description: "Invalid input: VALIDATION_ERROR. No coercion or unknown properties."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/BusinessError"
        "401":
          description: "Missing or invalid session; existing guard shape has no code."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/GuardError"
        "403":
          description: "Valid session without administrador; existing guard shape has no code."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/GuardError"
        "404":
          description: "EMPLOYEE_NOT_FOUND."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/BusinessError"
        "409":
          description: "Duplicate, stale version, reused operationId with different command, prohibited self-deactivation, access revocation or retry without requested access. See auth/employees.md."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/BusinessError"
        "503":
          description: "PERSISTENCE_UNAVAILABLE; never use this to report an IdP failure after the employee was saved."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/BusinessError"
  "/employees/{id}/deactivate":
    parameters:
      -
        name: "id"
        in: "path"
        required: true
        schema:
          type: "string"
          format: "uuid"
    post:
      operationId: "deactivateEmployee"
      summary: "Deactivate without deletion; request disable for a linked/requested identity"
      x-required-role: "administrador"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/EmployeeCommand"
      responses:
        "200":
          description: "Success; access synchronization does not roll back saved employment data."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/EmployeeMutationResult"
        "400":
          description: "Invalid input: VALIDATION_ERROR. No coercion or unknown properties."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/BusinessError"
        "401":
          description: "Missing or invalid session; existing guard shape has no code."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/GuardError"
        "403":
          description: "Valid session without administrador; existing guard shape has no code."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/GuardError"
        "404":
          description: "EMPLOYEE_NOT_FOUND."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/BusinessError"
        "409":
          description: "Duplicate, stale version, reused operationId with different command, prohibited self-deactivation, access revocation or retry without requested access. See auth/employees.md."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/BusinessError"
        "503":
          description: "PERSISTENCE_UNAVAILABLE; never use this to report an IdP failure after the employee was saved."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/BusinessError"
  "/employees/{id}/history":
    parameters:
      -
        name: "id"
        in: "path"
        required: true
        schema:
          type: "string"
          format: "uuid"
    get:
      operationId: "listEmployeeHistory"
      summary: "Read immutable business-change snapshots ordered by version ASC, id ASC"
      x-required-role: "administrador"
      parameters:
        -
          name: "limit"
          in: "query"
          required: false
          schema:
            type: "integer"
            minimum: 1
            maximum: 100
            default: 20
          description: "Maximum items."
        -
          name: "offset"
          in: "query"
          required: false
          schema:
            type: "integer"
            minimum: 0
            maximum: 2147483647
            default: 0
          description: "Zero-based offset."
      responses:
        "200":
          description: "Success; access synchronization does not roll back saved employment data."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/EmployeeHistoryPage"
        "400":
          description: "Invalid input: VALIDATION_ERROR. No coercion or unknown properties."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/BusinessError"
        "401":
          description: "Missing or invalid session; existing guard shape has no code."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/GuardError"
        "403":
          description: "Valid session without administrador; existing guard shape has no code."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/GuardError"
        "404":
          description: "EMPLOYEE_NOT_FOUND."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/BusinessError"
        "503":
          description: "PERSISTENCE_UNAVAILABLE; never use this to report an IdP failure after the employee was saved."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/BusinessError"
  "/employees/{id}/access/retry":
    parameters:
      -
        name: "id"
        in: "path"
        required: true
        schema:
          type: "string"
          format: "uuid"
    post:
      operationId: "retryEmployeeAccess"
      summary: "Reconcile latest desired identity state; never assigns roles or credentials"
      x-required-role: "administrador"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/EmployeeCommand"
      responses:
        "200":
          description: "Success; access synchronization does not roll back saved employment data."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/EmployeeMutationResult"
        "400":
          description: "Invalid input: VALIDATION_ERROR. No coercion or unknown properties."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/BusinessError"
        "401":
          description: "Missing or invalid session; existing guard shape has no code."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/GuardError"
        "403":
          description: "Valid session without administrador; existing guard shape has no code."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/GuardError"
        "404":
          description: "EMPLOYEE_NOT_FOUND."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/BusinessError"
        "409":
          description: "Duplicate, stale version, reused operationId with different command, prohibited self-deactivation, access revocation or retry without requested access. See auth/employees.md."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/BusinessError"
        "503":
          description: "PERSISTENCE_UNAVAILABLE; never use this to report an IdP failure after the employee was saved."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/BusinessError"
components:
  securitySchemes:
    bearer:
      type: "http"
      scheme: "bearer"
      bearerFormat: "JWT"
      description: "Existing CU01 guard: trusted issuer/JWKS, RS256, exp, sub, typ and autonexus-employees-api audience; realm role administrador required for every operation and record."
  schemas:
    CreateEmployee:
      type: "object"
      additionalProperties: false
      required:
        - "operationId"
        - "firstName"
        - "lastName"
        - "document"
        - "email"
        - "phone"
        - "jobTitle"
        - "startDate"
        - "specialties"
      properties:
        operationId:
          type: "string"
          format: "uuid"
        firstName:
          type: "string"
          minLength: 1
          maxLength: 100
        lastName:
          type: "string"
          minLength: 1
          maxLength: 100
        document:
          type: "string"
          minLength: 1
          maxLength: 40
          description: "Trim and collapse whitespace; unique normalized value including inactive employees."
        email:
          type: "string"
          minLength: 1
          maxLength: 254
          format: "email"
          description: "Trim; case-insensitive uniqueness including inactive employees."
        phone:
          type: "string"
          minLength: 7
          maxLength: 25
          pattern: "^(?=.*[0-9])[0-9+(). -]+$"
        jobTitle:
          type: "string"
          minLength: 1
          maxLength: 100
        startDate:
          type: "string"
          format: "date"
          description: "Valid calendar date YYYY-MM-DD, not later than the server UTC calendar date."
        specialties:
          type: "array"
          minItems: 0
          maxItems: 20
          uniqueItems: true
          items:
            type: "string"
            minLength: 1
            maxLength: 80
        access:
          type: "object"
          additionalProperties: false
          required:
            - "requested"
          properties:
            requested:
              type: "boolean"
              description: "Monotonic intent. Omitted/false on create means not requested. On update omission preserves intent; false after true is rejected (409 ACCESS_REQUEST_CANNOT_BE_REVOKED). Only employment deactivation requests account disabling."
    UpdateEmployee:
      type: "object"
      additionalProperties: false
      required:
        - "operationId"
        - "expectedVersion"
        - "firstName"
        - "lastName"
        - "document"
        - "email"
        - "phone"
        - "jobTitle"
        - "startDate"
        - "specialties"
      properties:
        operationId:
          type: "string"
          format: "uuid"
        expectedVersion:
          type: "integer"
          minimum: 1
        firstName:
          type: "string"
          minLength: 1
          maxLength: 100
        lastName:
          type: "string"
          minLength: 1
          maxLength: 100
        document:
          type: "string"
          minLength: 1
          maxLength: 40
          description: "Trim and collapse whitespace; unique normalized value including inactive employees."
        email:
          type: "string"
          minLength: 1
          maxLength: 254
          format: "email"
          description: "Trim; case-insensitive uniqueness including inactive employees."
        phone:
          type: "string"
          minLength: 7
          maxLength: 25
          pattern: "^(?=.*[0-9])[0-9+(). -]+$"
        jobTitle:
          type: "string"
          minLength: 1
          maxLength: 100
        startDate:
          type: "string"
          format: "date"
          description: "Valid calendar date YYYY-MM-DD, not later than the server UTC calendar date."
        specialties:
          type: "array"
          minItems: 0
          maxItems: 20
          uniqueItems: true
          items:
            type: "string"
            minLength: 1
            maxLength: 80
        access:
          type: "object"
          additionalProperties: false
          required:
            - "requested"
          properties:
            requested:
              type: "boolean"
              description: "Monotonic intent. Omitted/false on create means not requested. On update omission preserves intent; false after true is rejected (409 ACCESS_REQUEST_CANNOT_BE_REVOKED). Only employment deactivation requests account disabling."
    EmployeeCommand:
      type: "object"
      additionalProperties: false
      required:
        - "operationId"
        - "expectedVersion"
      properties:
        operationId:
          type: "string"
          format: "uuid"
        expectedVersion:
          type: "integer"
          minimum: 1
    EmployeeAccess:
      type: "object"
      additionalProperties: false
      required:
        - "requested"
        - "status"
        - "subject"
        - "attempts"
        - "errorCode"
      properties:
        requested:
          type: "boolean"
        status:
          type: "string"
          enum:
            - "not_requested"
            - "pending"
            - "synced"
            - "failed"
            - "conflict"
        subject:
          type:
            - "string"
            - "null"
          description: "Confirmed Keycloak subject, not a token; null until confirmed."
        attempts:
          type: "integer"
          minimum: 0
          description: "Cumulative persisted remote synchronization attempts for this employee."
        errorCode:
          type:
            - "string"
            - "null"
          enum:
            - "IDP_UNAVAILABLE"
            - "IDP_TIMEOUT"
            - "IDP_FORBIDDEN"
            - "IDP_OWNERSHIP_CONFLICT"
            - "IDP_RESPONSE_INVALID"
            - "IDP_ACCOUNT_DISABLED"
            - null
          description: "Sanitized synchronization code; null without an outstanding failure. No remote response bodies."
    Employee:
      type: "object"
      additionalProperties: false
      required:
        - "id"
        - "firstName"
        - "lastName"
        - "document"
        - "email"
        - "phone"
        - "jobTitle"
        - "startDate"
        - "specialties"
        - "status"
        - "version"
        - "createdAt"
        - "updatedAt"
        - "access"
      properties:
        id:
          type: "string"
          format: "uuid"
        firstName:
          type: "string"
          minLength: 1
          maxLength: 100
        lastName:
          type: "string"
          minLength: 1
          maxLength: 100
        document:
          type: "string"
          minLength: 1
          maxLength: 40
          description: "Trim and collapse whitespace; unique normalized value including inactive employees."
        email:
          type: "string"
          minLength: 1
          maxLength: 254
          format: "email"
          description: "Trim; case-insensitive uniqueness including inactive employees."
        phone:
          type: "string"
          minLength: 7
          maxLength: 25
          pattern: "^(?=.*[0-9])[0-9+(). -]+$"
        jobTitle:
          type: "string"
          minLength: 1
          maxLength: 100
        startDate:
          type: "string"
          format: "date"
          description: "Valid calendar date YYYY-MM-DD, not later than the server UTC calendar date."
        specialties:
          type: "array"
          minItems: 0
          maxItems: 20
          uniqueItems: true
          items:
            type: "string"
            minLength: 1
            maxLength: 80
        status:
          type: "string"
          enum:
            - "active"
            - "inactive"
        version:
          type: "integer"
          minimum: 1
        createdAt:
          type: "string"
          format: "date-time"
        updatedAt:
          type: "string"
          format: "date-time"
        access:
          "$ref": "#/components/schemas/EmployeeAccess"
    EmployeeMutationResult:
      type: "object"
      additionalProperties: false
      required:
        - "employee"
        - "replayed"
      properties:
        employee:
          "$ref": "#/components/schemas/Employee"
        replayed:
          type: "boolean"
    EmployeeHistoryEntry:
      type: "object"
      additionalProperties: false
      required:
        - "id"
        - "employeeId"
        - "operationId"
        - "action"
        - "actorSubject"
        - "occurredAt"
        - "version"
        - "snapshot"
      properties:
        id:
          type: "string"
          format: "uuid"
        employeeId:
          type: "string"
          format: "uuid"
        operationId:
          type: "string"
          format: "uuid"
        action:
          type: "string"
          enum:
            - "created"
            - "updated"
            - "deactivated"
        actorSubject:
          type: "string"
          minLength: 1
        occurredAt:
          type: "string"
          format: "date-time"
        version:
          type: "integer"
          minimum: 1
        snapshot:
          "$ref": "#/components/schemas/Employee"
    BusinessError:
      type: "object"
      additionalProperties: false
      required:
        - "statusCode"
        - "message"
        - "code"
      properties:
        statusCode:
          type: "integer"
          enum:
            - 400
            - 404
            - 409
            - 503
        message:
          type: "string"
        code:
          type: "string"
          enum:
            - "VALIDATION_ERROR"
            - "EMPLOYEE_NOT_FOUND"
            - "DUPLICATE_DOCUMENT"
            - "DUPLICATE_EMAIL"
            - "VERSION_CONFLICT"
            - "IDEMPOTENCY_CONFLICT"
            - "SELF_DEACTIVATION_FORBIDDEN"
            - "ACCESS_REQUEST_CANNOT_BE_REVOKED"
            - "ACCESS_NOT_REQUESTED"
            - "PERSISTENCE_UNAVAILABLE"
    GuardError:
      type: "object"
      additionalProperties: false
      required:
        - "statusCode"
        - "message"
      properties:
        statusCode:
          type: "integer"
          enum:
            - 401
            - 403
        message:
          type: "string"
    EmployeePage:
      type: "object"
      additionalProperties: false
      required:
        - "items"
        - "total"
        - "limit"
        - "offset"
      properties:
        items:
          type: "array"
          items:
            "$ref": "#/components/schemas/Employee"
        total:
          type: "integer"
          minimum: 0
        limit:
          type: "integer"
          minimum: 1
          maximum: 100
        offset:
          type: "integer"
          minimum: 0
    EmployeeHistoryPage:
      type: "object"
      additionalProperties: false
      required:
        - "items"
        - "total"
        - "limit"
        - "offset"
      properties:
        items:
          type: "array"
          items:
            "$ref": "#/components/schemas/EmployeeHistoryEntry"
        total:
          type: "integer"
          minimum: 0
        limit:
          type: "integer"
          minimum: 1
          maximum: 100
        offset:
          type: "integer"
          minimum: 0
