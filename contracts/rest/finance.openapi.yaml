            "tokenUrl": "http://127.0.0.1:8180/realms/autonexus/protocol/openid-connect/token",
            "scopes": {
              "cu15.finance.read": "Consultar vínculo/ledger",
              "cu15.finance.authorize": "Autorizar vínculo durable",
              "cu15.finance.cancel": "Compensar vínculo"
            }
          }
        }
      }
    },
    "schemas": {
