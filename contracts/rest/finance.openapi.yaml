          },
          "errorCode": {
            "type": [
              "string",
              "null"
            ],
            "enum": [
              null,
              "QUOTE_NOT_FOUND",
              "QUOTE_NOT_APPROVED",
              "QUOTE_APPROVAL_MISSING",
              "VERSION_CONFLICT",
              "QUOTE_ORDER_MISMATCH",
              "QUOTE_EXPIRED",
              "QUOTE_LINK_CANCELLED",
              "QUOTE_ALREADY_LINKED"
            ]
          },
          "committedAt": {
            "type": "string",
            "format": "date-time"
          },
          "replayed": {
            "type": "boolean"
          }
        },
        "allOf": [
          {
            "if": {
              "properties": {
                "outcome": {
                  "const": "applied"
                }
              }
            },
            "then": {
              "properties": {
                "resource": {
                  "$ref": "#/components/schemas/CurrentQuoteLink"
                },
                "errorCode": {
                  "type": "null"
                }
              }
            },
            "else": {
              "properties": {
                "resource": {
                  "type": "null"
                },
                "errorCode": {
                  "type": "string",
                  "enum": [
                    "QUOTE_NOT_FOUND",
                    "QUOTE_NOT_APPROVED",
                    "QUOTE_APPROVAL_MISSING",
                    "VERSION_CONFLICT",
                    "QUOTE_ORDER_MISMATCH",
                    "QUOTE_EXPIRED",
                    "QUOTE_LINK_CANCELLED",
                    "QUOTE_ALREADY_LINKED"
                  ]
                }
              }
            }
          }
        ],
        "description": "Snapshot histórico durable, no recurso actual. SHA-256 del JSON canónico UTF-8 de clientId/command/sagaId/body validado completo; claves ordenadas recursivamente y arrays en orden. UUID minúsculas, fechas UTC milisegundos. Sin token en huella. POST replay=true; GET conserva resultado almacenado. Ejemplo enteramente sintético; huella calculada para AuthorizeQuoteInput.examples[0], sagaId del ejemplo y cliente coordinador.",
        "examples": [
          {
            "operationId": "20000000-0000-4000-8000-000000000001",
            "sagaId": "20000000-0000-4000-8000-000000000005",
            "command": "authorize_quote",
            "fingerprint": "c409ddc34726bec8b86ac05206c3dd8128343b7ce019b7fc9e2b78591c9388bc",
            "outcome": "rejected",
            "resource": null,
            "errorCode": "QUOTE_NOT_APPROVED",
            "committedAt": "2026-11-02T12:00:00.000Z",
            "replayed": false
          }
        ]
      }
    }
