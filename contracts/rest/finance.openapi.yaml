{
  "openapi": "3.1.0",
  "info": {
    "title": "AutoNexus AI — Finanzas CU13/CU14 y participante privado CU15",
    "version": "1.0.0",
    "description": "Código existente y saga.md aprobado. Publicar OpenAPI no acredita APIs probadas ni integración. Web mediante GraphQL/integration/bff; BFF sin base ni coordinación. Operaciones coordina CU15. GET cotización no autoriza. validUntil fecha civil inclusiva America/La_Paz evaluada al commit financiero: vínculo no expira por timeout. approved/vinculadas inmutables; compensación conserva aprobación e historial. Sin APIs públicas de vínculo ni DELETE cotizaciones/decisiones. Actor humano solo token/reloj servidor, metadata interna solo cliente confiable. Timeout/5xx/GET404 no es rechazo: conciliar ledger y repetir mismo cuerpo/operationId; no cambiar expectedVersion a ciegas. Autorizar valida approved, aprobación registrada, versión exacta, misma orden y vigencia; vínculo/ledger/auditoría/Outbox atómicos. Replay histórico no reactiva cancelled."
  },
