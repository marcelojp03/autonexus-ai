            "type": "string",
            "format": "uuid"
          },
          "command": {
            "type": "string",
            "enum": [
              "authorize_quote",
              "cancel_quote_link"
            ]
          },
          "fingerprint": {
            "type": "string",
            "pattern": "^[a-f0-9]{64}$"
          },
          "outcome": {
            "type": "string",
            "enum": [
              "applied",
              "rejected"
            ]
          },
          "resource": {
            "anyOf": [
