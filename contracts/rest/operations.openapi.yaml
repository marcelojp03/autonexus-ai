openapi: 3.1.0
info:
  title: AutoNexus AI — Operaciones, recepción, órdenes y confirmación CU15
  version: 1.0.0
  description: >
    Superficie REST propietaria de MS01 (CU06, CU07, CU09, CU10, CU11, CU12, CU15). La web consume estas
    operaciones exclusivamente por GraphQL mediante integration/bff. Autorización por permiso
    del catálogo CU02 (`contracts/auth/permissions.md`): `<modulo>:read` para consultas y
    `<modulo>:write` para mutaciones. Una cita no es una orden de trabajo ni una asignación
    de mecánico. BFF no tiene base ni coordina participantes: delega CU15 a Operaciones.
    Solo confirmed acredita el commit local final; 202, aprobación financiera y disponibilidad
    no confirman el servicio. Timeout/5xx y GET404 no prueban rechazo. Recuperación conserva
    comandos/IDs/versiones; compensación pendiente conserva exclusión. Este contrato documenta
    fuentes existentes y saga.md aprobado; no acredita pruebas de APIs.
servers:
  - url: http://127.0.0.1:8081
security:
  - bearerAuth: []
paths:
  /customers:
    get:
      operationId: listCustomers
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: status, in: query, schema: { type: string, enum: [active, inactive] } }
        - { name: search, in: query, schema: { type: string, maxLength: 100 } }
      responses:
        '200':
          description: Página de clientes ordenada por alta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createCustomer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCustomerInput' }
      responses:
        '201':
          description: Cliente registrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerResult' }
        '400': { $ref: '#/components/responses/Invalid' }
        '409': { $ref: '#/components/responses/Conflict' }
  /customers/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getCustomer
      responses:
        '200':
          description: Ficha del cliente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Customer' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: updateCustomer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateCustomerInput' }
      responses:
        '200':
          description: Cliente actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerResult' }
        '400': { $ref: '#/components/responses/Invalid' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /customers/{id}/deactivate:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: deactivateCustomer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommandInput' }
      responses:
        '200':
          description: Cliente desactivado; el historial se conserva
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerResult' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /vehicles:
    get:
      operationId: listVehicles
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: status, in: query, schema: { type: string, enum: [active, inactive] } }
        - { name: customerId, in: query, schema: { type: string, format: uuid } }
        - { name: search, in: query, schema: { type: string, maxLength: 100 } }
      responses:
        '200':
          description: Página de vehículos con su propietario
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VehiclePage' }
    post:
      operationId: createVehicle
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateVehicleInput' }
      responses:
        '201':
          description: Vehículo registrado con su propietario inicial
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VehicleResult' }
        '400': { $ref: '#/components/responses/Invalid' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /vehicles/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getVehicle
      responses:
        '200':
          description: Ficha del vehículo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vehicle' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: updateVehicle
      description: Un cambio de propietario cierra la fila vigente de `vehicle_owners` y abre otra.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateVehicleInput' }
      responses:
        '200':
          description: Vehículo actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VehicleResult' }
        '409': { $ref: '#/components/responses/Conflict' }
  /vehicles/{id}/deactivate:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: deactivateVehicle
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommandInput' }
      responses:
        '200':
          description: Vehículo desactivado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VehicleResult' }
        '409': { $ref: '#/components/responses/Conflict' }
  /services:
    get:
      operationId: listServices
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: active, in: query, schema: { type: boolean } }
        - { name: search, in: query, schema: { type: string, maxLength: 100 } }
      responses:
        '200':
          description: Página del catálogo de servicios
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServicePage' }
    post:
      operationId: createService
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateServiceInput' }
      responses:
        '201':
          description: Servicio registrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceResult' }
        '400': { $ref: '#/components/responses/Invalid' }
        '409': { $ref: '#/components/responses/Conflict' }
  /services/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getService
      responses:
        '200':
          description: Ficha del servicio
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Service' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: updateService
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateServiceInput' }
      responses:
        '200':
          description: Servicio actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceResult' }
        '409': { $ref: '#/components/responses/Conflict' }
  /services/{id}/deactivate:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: deactivateService
      description: Los servicios usados antes no se eliminan; se desactivan y conservan su historial.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommandInput' }
      responses:
        '200':
          description: Servicio desactivado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceResult' }
        '409': { $ref: '#/components/responses/Conflict' }
  /appointments:
    get:
      operationId: listAppointments
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - name: from
          in: query
          description: ISO-8601 con offset; filtra citas que terminan después del instante
          schema: { type: string, format: date-time }
        - name: to
          in: query
          description: ISO-8601 con offset; filtra citas que empiezan antes del instante
          schema: { type: string, format: date-time }
        - { name: status, in: query, schema: { type: string, enum: [scheduled, cancelled] } }
        - { name: customerId, in: query, schema: { type: string, format: uuid } }
        - { name: vehicleId, in: query, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Página de citas con cliente, vehículo y servicio resueltos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppointmentPage' }
    post:
      operationId: createAppointment
      description: >
        Reserva una franja para un vehículo y un servicio. Valida cliente/vehículo/servicio
        activos, propiedad del vehículo, duplicados, solapamiento del vehículo y capacidad del
        taller. No crea una orden de trabajo.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAppointmentInput' }
      responses:
        '201':
          description: Cita programada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppointmentResult' }
        '400': { $ref: '#/components/responses/Invalid' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /appointments/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getAppointment
      responses:
        '200':
          description: Detalle de la cita
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Appointment' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: rescheduleAppointment
      description: Reprogramar repite todas las validaciones de disponibilidad.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RescheduleAppointmentInput' }
      responses:
        '200':
          description: Cita reprogramada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppointmentResult' }
        '409': { $ref: '#/components/responses/Conflict' }
  /appointments/{id}/cancel:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: cancelAppointment
      description: Cancela con motivo, libera la franja y conserva la cita.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [operationId, expectedVersion, reason]
              additionalProperties: false
              properties:
                operationId: { type: string, format: uuid }
                expectedVersion: { type: integer, minimum: 1 }
                reason: { type: string, minLength: 1, maxLength: 200 }
      responses:
        '200':
          description: Cita cancelada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppointmentResult' }
        '409': { $ref: '#/components/responses/Conflict' }
  "/receptions":
    "get":
      "operationId": "listReceptions"
      "x-permission": "receptions:read"
      "security":
        -
          "bearerAuth": []
      "responses":
        "200":
          "description": "Consulta propietaria"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ReceptionPage"
        "400":
          "$ref": "#/components/responses/Invalid"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
      "parameters":
        -
          "name": "limit"
          "in": "query"
          "schema":
            "type": "integer"
            "minimum": 1
            "maximum": 100
            "default": 20
        -
          "name": "offset"
          "in": "query"
          "schema":
            "type": "integer"
            "minimum": 0
            "maximum": 2147483647
            "default": 0
        -
          "name": "vehicleId"
          "in": "query"
          "schema":
            "type": "string"
            "format": "uuid"
        -
          "name": "open"
          "in": "query"
          "schema":
            "type": "boolean"
          "description": "true: sin orden; false: con orden; omitido/vacío: ambos. Solo literales true/false."
    "post":
      "operationId": "createReception"
      "x-permission": "receptions:write"
      "security":
        -
          "bearerAuth": []
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/CreateReceptionInput"
      "responses":
        "201":
          "description": "Recurso registrado; replay también retorna 201"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ReceptionResult"
        "400":
          "$ref": "#/components/responses/Invalid"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "description": "RECEPTION_NOT_FOUND, ORDER_NOT_FOUND, VEHICLE_NOT_FOUND, APPOINTMENT_NOT_FOUND, SERVICE_NOT_FOUND"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/BusinessError"
        "409":
          "description": "IDEMPOTENCY_CONFLICT, VEHICLE_INACTIVE, CUSTOMER_INACTIVE, VEHICLE_OWNERSHIP_MISMATCH, APPOINTMENT_NOT_SCHEDULED, MILEAGE_REGRESSION, VEHICLE_ALREADY_IN_RECEPTION, ORDER_ALREADY_EXISTS, SERVICE_INACTIVE, DUPLICATE_SERVICE"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/BusinessError"
  "/receptions/{id}":
    "parameters":
      -
        "name": "id"
        "in": "path"
        "required": true
        "schema":
          "type": "string"
          "format": "uuid"
    "get":
      "operationId": "getReception"
      "x-permission": "receptions:read"
      "security":
        -
          "bearerAuth": []
      "responses":
        "200":
          "description": "Consulta propietaria"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Reception"
        "400":
          "$ref": "#/components/responses/Invalid"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "description": "RECEPTION_NOT_FOUND, ORDER_NOT_FOUND, VEHICLE_NOT_FOUND, APPOINTMENT_NOT_FOUND, SERVICE_NOT_FOUND"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/BusinessError"
  "/orders":
    "get":
      "operationId": "listWorkOrders"
      "x-permission": "orders:read"
      "security":
        -
          "bearerAuth": []
      "responses":
        "200":
          "description": "Consulta propietaria"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/WorkOrderPage"
        "400":
          "$ref": "#/components/responses/Invalid"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
      "parameters":
        -
          "name": "limit"
          "in": "query"
          "schema":
            "type": "integer"
            "minimum": 1
            "maximum": 100
            "default": 20
        -
          "name": "offset"
          "in": "query"
          "schema":
            "type": "integer"
            "minimum": 0
            "maximum": 2147483647
            "default": 0
        -
          "name": "status"
          "in": "query"
          "schema":
            "$ref": "#/components/schemas/WorkOrderStatus"
        -
          "name": "customerId"
          "in": "query"
          "schema":
            "type": "string"
            "format": "uuid"
        -
          "name": "vehicleId"
          "in": "query"
          "schema":
            "type": "string"
            "format": "uuid"
    "post":
      "operationId": "createWorkOrder"
      "x-permission": "orders:write"
      "security":
        -
          "bearerAuth": []
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/CreateWorkOrderInput"
      "responses":
        "201":
          "description": "Recurso registrado; replay también retorna 201"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/WorkOrderResult"
        "400":
          "$ref": "#/components/responses/Invalid"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "description": "RECEPTION_NOT_FOUND, ORDER_NOT_FOUND, VEHICLE_NOT_FOUND, APPOINTMENT_NOT_FOUND, SERVICE_NOT_FOUND"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/BusinessError"
        "409":
          "description": "IDEMPOTENCY_CONFLICT, VEHICLE_INACTIVE, CUSTOMER_INACTIVE, VEHICLE_OWNERSHIP_MISMATCH, APPOINTMENT_NOT_SCHEDULED, MILEAGE_REGRESSION, VEHICLE_ALREADY_IN_RECEPTION, ORDER_ALREADY_EXISTS, SERVICE_INACTIVE, DUPLICATE_SERVICE"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/BusinessError"
  "/orders/{id}":
    "parameters":
      -
        "name": "id"
        "in": "path"
        "required": true
        "schema":
          "type": "string"
          "format": "uuid"
    "get":
      "operationId": "getWorkOrder"
      "x-permission": "orders:read"
      "security":
        -
          "bearerAuth": []
      "responses":
        "200":
          "description": "Consulta propietaria"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/WorkOrder"
        "400":
          "$ref": "#/components/responses/Invalid"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "description": "RECEPTION_NOT_FOUND, ORDER_NOT_FOUND, VEHICLE_NOT_FOUND, APPOINTMENT_NOT_FOUND, SERVICE_NOT_FOUND"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/BusinessError"
  "/orders/{orderId}/confirmations":
    "parameters":
      -
        "name": "orderId"
        "in": "path"
        "required": true
        "schema":
          "type": "string"
          "format": "uuid"
    "get":
      "operationId": "listOrderConfirmations"
      "x-permission": "confirmations:read"
      "security":
        -
          "bearerAuth": []
      "responses":
        "200":
          "description": "Consulta propietaria"
          "content":
            "application/json":
              "schema":
                "type": "array"
                "items":
                  "$ref": "#/components/schemas/ConfirmationSaga"
        "400":
          "$ref": "#/components/responses/Invalid"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "description": "ORDER_NOT_FOUND, CONFIRMATION_NOT_FOUND, OPERATION_NOT_FOUND; operación desconocida ahora no acredita rechazo ni ausencia de envío en vuelo"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/BusinessError"
        "503":
          "description": "CU15_DISABLED; no prueba de rechazo de una intención previamente aceptada"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/BusinessError"
    "post":
      "operationId": "startServiceConfirmation"
      "x-permission": "confirmations:write"
      "security":
        -
          "bearerAuth": []
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/StartServiceConfirmationInput"
      "responses":
        "202":
          "description": "Intención aceptada; consultar estado vigente, no servicio confirmado"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ConfirmationSaga"
        "400":
          "$ref": "#/components/responses/Invalid"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "description": "ORDER_NOT_FOUND, CONFIRMATION_NOT_FOUND, OPERATION_NOT_FOUND; operación desconocida ahora no acredita rechazo ni ausencia de envío en vuelo"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/BusinessError"
        "409":
          "description": "IDEMPOTENCY_CONFLICT, VERSION_CONFLICT, ORDER_ALREADY_CONFIRMED, ORDER_CONFIRMATION_IN_PROGRESS, ORDER_NOT_CONFIRMABLE, CONFIRMATION_TERMINAL, CONFIRMATION_BUSY"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/BusinessError"
        "503":
          "description": "CU15_DISABLED; no prueba de rechazo de una intención previamente aceptada"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/BusinessError"
      "description": "Operaciones persiste inicio/orden confirmation_pending/Saga/comandos/Outbox local. Misma operationId y actor/cuerpo normalizados devuelve misma Saga con estado vigente; distinto contenido/destino/versión IDEMPOTENCY_CONFLICT. Solo una Saga no terminal por orden. BFF delega, no coordina. No persiste JWT humano."
  "/confirmations/{sagaId}":
    "parameters":
      -
        "name": "sagaId"
        "in": "path"
        "required": true
        "schema":
          "type": "string"
          "format": "uuid"
    "get":
      "operationId": "getConfirmationSaga"
      "x-permission": "confirmations:read"
      "security":
        -
          "bearerAuth": []
      "responses":
        "200":
          "description": "Consulta propietaria"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ConfirmationSaga"
        "400":
          "$ref": "#/components/responses/Invalid"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "description": "ORDER_NOT_FOUND, CONFIRMATION_NOT_FOUND, OPERATION_NOT_FOUND; operación desconocida ahora no acredita rechazo ni ausencia de envío en vuelo"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/BusinessError"
        "503":
          "description": "CU15_DISABLED; no prueba de rechazo de una intención previamente aceptada"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/BusinessError"
  "/confirmations/operations/{operationId}":
    "parameters":
      -
        "name": "operationId"
        "in": "path"
        "required": true
        "schema":
          "type": "string"
          "format": "uuid"
    "get":
      "operationId": "getConfirmationByOperation"
      "x-permission": "confirmations:read"
      "security":
        -
          "bearerAuth": []
      "responses":
        "200":
          "description": "Consulta propietaria"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ConfirmationSaga"
        "400":
          "$ref": "#/components/responses/Invalid"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "description": "ORDER_NOT_FOUND, CONFIRMATION_NOT_FOUND, OPERATION_NOT_FOUND; operación desconocida ahora no acredita rechazo ni ausencia de envío en vuelo"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/BusinessError"
        "503":
          "description": "CU15_DISABLED; no prueba de rechazo de una intención previamente aceptada"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/BusinessError"
  "/confirmations/{sagaId}/retry":
    "parameters":
      -
        "name": "sagaId"
        "in": "path"
        "required": true
        "schema":
          "type": "string"
          "format": "uuid"
    "post":
      "operationId": "retryServiceConfirmation"
      "x-permission": "confirmations:write"
      "security":
        -
          "bearerAuth": []
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/ConfirmationRetryInput"
      "responses":
        "202":
          "description": "Intención aceptada; consultar estado vigente, no servicio confirmado"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ConfirmationSaga"
        "400":
          "$ref": "#/components/responses/Invalid"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "description": "ORDER_NOT_FOUND, CONFIRMATION_NOT_FOUND, OPERATION_NOT_FOUND; operación desconocida ahora no acredita rechazo ni ausencia de envío en vuelo"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/BusinessError"
        "409":
          "description": "IDEMPOTENCY_CONFLICT, VERSION_CONFLICT, ORDER_ALREADY_CONFIRMED, ORDER_CONFIRMATION_IN_PROGRESS, ORDER_NOT_CONFIRMABLE, CONFIRMATION_TERMINAL, CONFIRMATION_BUSY"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/BusinessError"
        "503":
          "description": "CU15_DISABLED; no prueba de rechazo de una intención previamente aceptada"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/BusinessError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Invalid:
      description: VALIDATION_ERROR
      content:
        application/json:
          schema: { $ref: '#/components/schemas/BusinessError' }
    Unauthorized:
      description: Token ausente o inválido
    Forbidden:
      description: Permiso insuficiente o permisos no resolubles
    NotFound:
      description: CUSTOMER_NOT_FOUND, VEHICLE_NOT_FOUND, SERVICE_NOT_FOUND, APPOINTMENT_NOT_FOUND
      content:
        application/json:
          schema: { $ref: '#/components/schemas/BusinessError' }
    Conflict:
      description: >
        DUPLICATE_DOCUMENT, DUPLICATE_PLATE, DUPLICATE_SERVICE, CUSTOMER_INACTIVE, VEHICLE_INACTIVE,
        VEHICLE_OWNERSHIP_MISMATCH, SERVICE_INACTIVE, APPOINTMENT_DUPLICATE, APPOINTMENT_OVERLAP,
        APPOINTMENT_NOT_SCHEDULED, WORKSHOP_CAPACITY_EXCEEDED, VEHICLE_HAS_SCHEDULED_APPOINTMENTS,
        CUSTOMER_HAS_SCHEDULED_APPOINTMENTS, VERSION_CONFLICT, IDEMPOTENCY_CONFLICT
      content:
        application/json:
          schema: { $ref: '#/components/schemas/BusinessError' }
  schemas:
    "WorkOrderStatus":
      "type": "string"
      "enum": ["pending_quote","quote_requested","quote_approved","cancelled","confirmation_pending","confirmed"]
      "description": "Estados anteriores conservados. Crear produce pending_quote; solo commit local final CU15 produce confirmed; rechazo compensado vuelve a pending_quote con nueva versión."
    "CreateReceptionInput":
      "type": "object"
      "required": ["operationId","vehicleId","mileage","reason"]
      "additionalProperties": false
      "properties":
        "operationId":
          "type": "string"
          "format": "uuid"
        "vehicleId":
          "type": "string"
          "format": "uuid"
        "appointmentId":
          "type": ["string","null"]
          "format": "uuid"
        "mileage":
          "type": "integer"
          "minimum": 0
          "maximum": 2000000
        "reason":
          "type": "string"
          "minLength": 3
          "maxLength": 300
        "symptoms":
          "type": ["string","null"]
          "maxLength": 1000
        "visibleConditions":
          "type": ["string","null"]
          "maxLength": 1000
    "Reception":
      "type": "object"
      "required": ["id","vehicleId","vehiclePlate","customerId","customerName","appointmentId","mileage","reason","symptoms","visibleConditions","hasOrder","receivedAt","version"]
      "properties":
        "id":
          "type": "string"
          "format": "uuid"
        "vehicleId":
          "type": "string"
          "format": "uuid"
        "vehiclePlate":
          "type": "string"
        "customerId":
          "type": "string"
          "format": "uuid"
        "customerName":
          "type": "string"
        "appointmentId":
          "type": ["string","null"]
          "format": "uuid"
        "mileage":
          "type": "integer"
        "reason":
          "type": "string"
        "symptoms":
          "type": ["string","null"]
        "visibleConditions":
          "type": ["string","null"]
        "hasOrder":
          "type": "boolean"
        "receivedAt":
          "type": "string"
          "format": "date-time"
        "version":
          "type": "integer"
          "minimum": 1
          "maximum": 2147483647
    "CreateWorkOrderInput":
      "type": "object"
      "required": ["operationId","receptionId","description","priority","services"]
      "additionalProperties": false
      "properties":
        "operationId":
          "type": "string"
          "format": "uuid"
        "receptionId":
          "type": "string"
          "format": "uuid"
        "description":
          "type": "string"
          "minLength": 3
          "maxLength": 1000
        "priority":
          "type": "string"
          "enum": ["baja","normal","alta","urgente"]
        "notes":
          "type": ["string","null"]
          "maxLength": 1000
        "services":
          "type": "array"
          "items":
            "type": "object"
            "required": ["serviceId"]
            "additionalProperties": false
            "properties":
              "serviceId":
                "type": "string"
                "format": "uuid"
              "quantity":
                "type": "integer"
                "minimum": 1
                "maximum": 99
                "default": 1
          "minItems": 1
          "maxItems": 20
      "description": "serviceId distintos y activos. Copia duración y tarifa propietarias. Crear no asigna mecánico ni confirma servicio."
    "WorkOrderItem":
      "type": "object"
      "required": ["serviceId","serviceName","quantity","estimatedMinutes","referenceRate"]
      "properties":
        "serviceId":
          "type": "string"
          "format": "uuid"
        "serviceName":
          "type": "string"
        "quantity":
          "type": "integer"
        "estimatedMinutes":
          "type": "integer"
        "referenceRate":
          "type": "number"
    "WorkOrder":
      "type": "object"
      "required": ["id","number","receptionId","vehicleId","vehiclePlate","customerId","customerName","description","priority","notes","status","version","createdAt","updatedAt","items"]
      "properties":
        "id":
          "type": "string"
          "format": "uuid"
        "number":
          "type": "string"
        "receptionId":
          "type": "string"
          "format": "uuid"
        "vehicleId":
          "type": "string"
          "format": "uuid"
        "vehiclePlate":
          "type": "string"
        "customerId":
          "type": "string"
          "format": "uuid"
        "customerName":
          "type": "string"
        "description":
          "type": "string"
        "priority":
          "type": "string"
          "enum": ["baja","normal","alta","urgente"]
        "notes":
          "type": ["string","null"]
        "status":
          "$ref": "#/components/schemas/WorkOrderStatus"
        "version":
          "type": "integer"
          "minimum": 1
          "maximum": 2147483647
        "createdAt":
          "type": "string"
          "format": "date-time"
        "updatedAt":
          "type": "string"
          "format": "date-time"
        "items":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/WorkOrderItem"
      "description": "DTO actual sin assignmentId/quoteLinkId ni sus versiones; esas referencias se consultan en ConfirmationSaga, no se infieren de columnas SQL."
    "ReceptionPage":
      "type": "object"
      "required": ["items","total","limit","offset"]
      "properties":
        "items":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/Reception"
        "total":
          "type": "integer"
          "minimum": 0
        "limit":
          "type": "integer"
          "minimum": 1
          "maximum": 2147483647
        "offset":
          "type": "integer"
          "minimum": 0
    "ReceptionResult":
      "type": "object"
      "required": ["reception","replayed"]
      "properties":
        "reception":
          "$ref": "#/components/schemas/Reception"
        "replayed":
          "type": "boolean"
    "WorkOrderPage":
      "type": "object"
      "required": ["items","total","limit","offset"]
      "properties":
        "items":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/WorkOrder"
        "total":
          "type": "integer"
          "minimum": 0
        "limit":
          "type": "integer"
          "minimum": 1
          "maximum": 2147483647
        "offset":
          "type": "integer"
          "minimum": 0
    "WorkOrderResult":
      "type": "object"
      "required": ["order","replayed"]
      "properties":
        "order":
          "$ref": "#/components/schemas/WorkOrder"
        "replayed":
          "type": "boolean"
    "StartServiceConfirmationInput":
      "type": "object"
      "required": ["operationId","expectedVersion","quoteId","quoteVersion","employeeId","employeeVersion","requiredSpecialty","startsAt","endsAt"]
      "additionalProperties": false
      "properties":
        "operationId":
          "type": "string"
          "format": "uuid"
        "expectedVersion":
          "type": "integer"
          "minimum": 1
          "maximum": 2147483647
        "quoteId":
          "type": "string"
          "format": "uuid"
        "quoteVersion":
          "type": "integer"
          "minimum": 1
          "maximum": 2147483647
        "employeeId":
          "type": "string"
          "format": "uuid"
        "employeeVersion":
          "type": "integer"
          "minimum": 1
          "maximum": 2147483647
        "requiredSpecialty":
          "type": "string"
          "minLength": 1
          "maxLength": 80
        "startsAt":
          "type": "string"
          "format": "date-time"
        "endsAt":
          "type": "string"
          "format": "date-time"
      "description": "Conjunto cerrado. expectedVersion de orden, employeeVersion laboral, quoteVersion exacta. Offset obligatorio; startsAt < endsAt; intervalo de un día America/La_Paz sin cruce de medianoche, futuro al reservar y revalidado por Empleados. initiatedBy/authorizedAt solo token verificado/reloj servidor, nunca body humano."
      "examples":
        -
          "operationId": "10000000-0000-4000-8000-000000000001"
          "expectedVersion": 1
          "quoteId": "10000000-0000-4000-8000-000000000002"
          "quoteVersion": 1
          "employeeId": "10000000-0000-4000-8000-000000000003"
          "employeeVersion": 2
          "requiredSpecialty": "Especialidad sintética"
          "startsAt": "2026-11-02T09:00:00-04:00"
          "endsAt": "2026-11-02T10:00:00-04:00"
    "ConfirmationRetryInput":
      "type": "object"
      "required": ["operationId","expectedVersion"]
      "additionalProperties": false
      "properties":
        "operationId":
          "type": "string"
          "format": "uuid"
        "expectedVersion":
          "type": "integer"
          "minimum": 1
          "maximum": 2147483647
      "description": "Versión de Saga; recupera misma intención y comandos congelados. No crea otra confirmación ni cambia payload/expectedVersion del participante."
      "examples":
        -
          "operationId": "10000000-0000-4000-8000-000000000004"
          "expectedVersion": 2
    "ConfirmationStatus":
      "type": "string"
      "enum": ["running","recovery_pending","compensating","compensation_pending","confirmed","rejected"]
      "description": "Solo confirmed es éxito; rejected exige compensación completa y ningún efecto incierto. Sin TTL de reserva por timeout."
    "ConfirmationStep":
      "type": "object"
      "required": ["operationId","command","direction","status","attempts","errorCode","resourceVersion","outcome","committedAt","resourceStatus"]
      "properties":
        "operationId":
          "type": "string"
          "format": "uuid"
        "command":
          "type": "string"
          "enum": ["reserve_assignment","authorize_quote","confirm_assignment","release_assignment","cancel_quote_link"]
        "direction":
          "type": "string"
          "enum": ["forward","compensation"]
        "status":
          "type": "string"
          "enum": ["pending","dispatched","applied","rejected","uncertain"]
        "attempts":
          "type": "integer"
          "minimum": 0
        "errorCode":
          "type": ["string","null"]
        "resourceVersion":
          "type": ["integer","null"]
          "minimum": 1
          "maximum": 2147483647
        "outcome":
          "type": ["string","null"]
          "enum": ["applied","rejected",null]
        "committedAt":
          "type": ["string","null"]
          "format": "date-time"
        "resourceStatus":
          "type": ["string","null"]
    "ConfirmationSaga":
      "type": "object"
      "required": ["sagaId","orderId","status","phase","version","orderVersion","nextAttemptAt","errorCode","operationId","quoteId","quoteVersion","employeeId","employeeVersion","requiredSpecialty","startsAt","endsAt","assignmentId","assignmentVersion","quoteLinkId","quoteLinkVersion","steps"]
      "properties":
        "sagaId":
          "type": "string"
          "format": "uuid"
        "orderId":
          "type": "string"
          "format": "uuid"
        "status":
          "$ref": "#/components/schemas/ConfirmationStatus"
        "phase":
          "type": "string"
          "description": "Fases actuales: reserve_assignment, authorize_quote, confirm_assignment, confirm_order, release_assignment, cancel_quote_link, reject_order, confirmed, rejected."
        "version":
          "type": "integer"
          "minimum": 1
          "maximum": 2147483647
        "orderVersion":
          "type": "integer"
          "minimum": 1
          "maximum": 2147483647
        "nextAttemptAt":
          "type": ["string","null"]
          "format": "date-time"
        "errorCode":
          "type": ["string","null"]
        "operationId":
          "type": "string"
          "format": "uuid"
        "quoteId":
          "type": "string"
          "format": "uuid"
        "quoteVersion":
          "type": "integer"
          "minimum": 1
          "maximum": 2147483647
        "employeeId":
          "type": "string"
          "format": "uuid"
        "employeeVersion":
          "type": "integer"
          "minimum": 1
          "maximum": 2147483647
        "requiredSpecialty":
          "type": "string"
        "startsAt":
          "type": "string"
          "format": "date-time"
        "endsAt":
          "type": "string"
          "format": "date-time"
        "assignmentId":
          "type": ["string","null"]
          "format": "uuid"
        "assignmentVersion":
          "type": ["integer","null"]
          "minimum": 1
          "maximum": 2147483647
        "quoteLinkId":
          "type": ["string","null"]
          "format": "uuid"
        "quoteLinkVersion":
          "type": ["integer","null"]
          "minimum": 1
          "maximum": 2147483647
        "steps":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/ConfirmationStep"
      "description": "Proyección exacta de ConfirmationController.progress; claves presentes con null cuando no hay efecto/resultado, como campos opcionales GraphQL. Sin token, huella interna ni metadata de autoridad humana. assignmentId/quoteLinkId pueden faltar (null) mientras participantes no aplicaron. Ledger por operationId reconcilia inicio con Saga vigente, no snapshot del participante."
    BusinessError:
      type: object
      required: [statusCode, message, code]
      properties:
        statusCode: { type: integer }
        message: { type: string }
        code: { type: string }
    CommandInput:
      type: object
      required: [operationId, expectedVersion]
      additionalProperties: false
      properties:
        operationId: { type: string, format: uuid }
        expectedVersion: { type: integer, minimum: 1 }
    Customer:
      type: object
      required: [id, firstName, lastName, document, phone, status, version, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        firstName: { type: string }
        lastName: { type: string }
        document: { type: string, pattern: '^[0-9A-Z]{4,20}$' }
        phone: { type: string }
        email: { type: [string, 'null'] }
        address: { type: [string, 'null'] }
        status: { type: string, enum: [active, inactive] }
        version: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CustomerPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Customer' } }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
    Vehicle:
      type: object
      required: [id, customerId, customerName, plate, make, model, year, fuelType, status, version]
      properties:
        id: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        customerName: { type: string }
        plate: { type: string, pattern: '^[0-9A-Z]{5,10}$' }
        make: { type: string }
        model: { type: string }
        year: { type: integer, minimum: 1950 }
        fuelType: { type: string, enum: [gasolina, diesel, gas, electrico, hibrido] }
        color: { type: [string, 'null'] }
        status: { type: string, enum: [active, inactive] }
        version: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    VehiclePage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Vehicle' } }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
    Service:
      type: object
      required: [id, name, description, category, estimatedMinutes, referenceRate, active, version]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 3, maxLength: 80 }
        description: { type: string, minLength: 1, maxLength: 300 }
        category: { type: string, enum: [mantenimiento, reparacion, diagnostico, otros] }
        estimatedMinutes: { type: integer, minimum: 15, maximum: 480 }
        referenceRate: { type: number, minimum: 0, maximum: 9999999.99 }
        active: { type: boolean }
        version: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ServicePage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Service' } }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
    Appointment:
      type: object
      required: [id, customerId, customerName, vehicleId, vehiclePlate, serviceId, serviceName, startsAt, endsAt, status, version]
      properties:
        id: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        customerName: { type: string }
        vehicleId: { type: string, format: uuid }
        vehiclePlate: { type: string }
        serviceId: { type: string, format: uuid }
        serviceName: { type: string }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        status: { type: string, enum: [scheduled, cancelled] }
        notes: { type: [string, 'null'] }
        cancelReason: { type: [string, 'null'] }
        version: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AppointmentPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Appointment' } }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
    CreateCustomerInput:
      type: object
      required: [operationId, firstName, lastName, document, phone]
      additionalProperties: false
      properties:
        operationId: { type: string, format: uuid }
        firstName: { type: string, maxLength: 100 }
        lastName: { type: string, maxLength: 100 }
        document: { type: string }
        phone: { type: string }
        email: { type: string }
        address: { type: string, maxLength: 200 }
    UpdateCustomerInput:
      allOf:
        - { $ref: '#/components/schemas/CreateCustomerInput' }
        - type: object
          required: [expectedVersion]
          properties:
            expectedVersion: { type: integer, minimum: 1 }
    CreateVehicleInput:
      type: object
      required: [operationId, customerId, plate, make, model, year, fuelType]
      additionalProperties: false
      properties:
        operationId: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        plate: { type: string }
        make: { type: string, maxLength: 60 }
        model: { type: string, maxLength: 60 }
        year: { type: integer }
        fuelType: { type: string, enum: [gasolina, diesel, gas, electrico, hibrido] }
        color: { type: string, maxLength: 40 }
    UpdateVehicleInput:
      allOf:
        - { $ref: '#/components/schemas/CreateVehicleInput' }
        - type: object
          required: [expectedVersion]
          properties:
            expectedVersion: { type: integer, minimum: 1 }
    CreateServiceInput:
      type: object
      required: [operationId, name, description, category, estimatedMinutes, referenceRate]
      additionalProperties: false
      properties:
        operationId: { type: string, format: uuid }
        name: { type: string, minLength: 3, maxLength: 80 }
        description: { type: string, minLength: 1, maxLength: 300 }
        category: { type: string, enum: [mantenimiento, reparacion, diagnostico, otros] }
        estimatedMinutes: { type: integer, minimum: 15, maximum: 480 }
        referenceRate: { type: number, minimum: 0, maximum: 9999999.99 }
    UpdateServiceInput:
      allOf:
        - { $ref: '#/components/schemas/CreateServiceInput' }
        - type: object
          required: [expectedVersion]
          properties:
            expectedVersion: { type: integer, minimum: 1 }
    CreateAppointmentInput:
      type: object
      required: [operationId, customerId, vehicleId, serviceId, startsAt]
      additionalProperties: false
      properties:
        operationId: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        vehicleId: { type: string, format: uuid }
        serviceId: { type: string, format: uuid }
        startsAt:
          type: string
          format: date-time
          description: ISO-8601 con offset explícito, por ejemplo 2026-12-01T09:00:00-04:00
        notes: { type: string, maxLength: 500 }
    RescheduleAppointmentInput:
      type: object
      required: [operationId, expectedVersion, startsAt]
      additionalProperties: false
      properties:
