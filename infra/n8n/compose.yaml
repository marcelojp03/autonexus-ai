services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.46.6@sha256:8602f5dfacbe2c931eeafd010de0e68182310e9f309921e780ab69182e92b3ae
    init: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    ports: ["127.0.0.1:${N8N_PORT:-5678}:5678"]
    environment:
      N8N_HOST: "127.0.0.1"
      N8N_PORT: "5678"
      N8N_PROTOCOL: "http"
      WEBHOOK_URL: "http://127.0.0.1:${N8N_PORT:-5678}/"
      N8N_ENCRYPTION_KEY: "${N8N_ENCRYPTION_KEY:?set a private random encryption key}"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
      N8N_SECURE_COOKIE: "false"
      GENERIC_TIMEZONE: "America/La_Paz"
      # A read-only flow must not retain raw owner payloads in the n8n database.
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: "none"
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: "false"
      EXECUTIONS_DATA_SAVE_ON_PROGRESS: "false"
      # Errors keep their message so a failed run is diagnosable; payloads are still not saved on success.
      EXECUTIONS_DATA_SAVE_ON_ERROR: "all"
      EXECUTIONS_DATA_PRUNE: "true"
      N8N_RUNNERS_ENABLED: "true"
    # The workflow reaches Operations by service name on the project network.
    networks: ["autonexus"]
    volumes:
      - type: volume
        source: n8n-data
        target: /home/node/.n8n
networks:
  autonexus:
    external: true
    name: ${N8N_NETWORK:-cu16-proof_default}
volumes:
  n8n-data: {}
