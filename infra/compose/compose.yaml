name: autonexus-backend-dev
services:
  postgres:
    image: postgres:17.11-bookworm
    container_name: autonexus-backend-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-autonexus_admin}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Run scripts/init-env.mjs first}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      OPERATIONS_DB: ${OPERATIONS_DB:-autonexus_operations}
      OPERATIONS_USER: ${OPERATIONS_USER:-autonexus_operations}
      OPERATIONS_PASSWORD: ${OPERATIONS_PASSWORD:?Missing local operations password}
      EMPLOYEES_DB: ${EMPLOYEES_DB:-autonexus_employees}
      EMPLOYEES_USER: ${EMPLOYEES_USER:-autonexus_employees}
      EMPLOYEES_PASSWORD: ${EMPLOYEES_PASSWORD:?Missing local employees password}
      FINANCE_DB: ${FINANCE_DB:-autonexus_finance}
      FINANCE_USER: ${FINANCE_USER:-autonexus_finance}
      FINANCE_PASSWORD: ${FINANCE_PASSWORD:?Missing local finance password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s
volumes:
  postgres-data:
