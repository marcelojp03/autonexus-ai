server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 1m;
    resolver 127.0.0.11 valid=10s ipv6=off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location = /health/live { access_log off; return 200 'UP'; add_header Content-Type text/plain; }
    location = /runtime-config.js {
        alias /run/config/runtime-config.js;
        default_type application/javascript;
        add_header Cache-Control 'no-store';
        add_header X-Content-Type-Options nosniff always;
    }
    location = /graphql {
        set $bff http://bff:3004;
        proxy_pass $bff/graphql;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 25s;
    }
    location = /identity { return 308 /identity/; }
    location = /identity/admin { return 404; }
    location ^~ /identity/admin/ { return 404; }
    location = /identity/realms/master { return 404; }
    location ^~ /identity/realms/master/ { return 404; }
    location ^~ /identity/ {
        # The issuer remains the configured PUBLIC_ORIGIN, never the container DNS.
        set $idp http://keycloak:8080;
        proxy_pass $idp$request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header Forwarded "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
    }
    location ~ ^/technical/(employees|operations)/(session|admin)$ {
        set $technical_port 3002;
        if ($1 = operations) { set $technical_port 8081; }
        set $technical_host $1;
        set $technical_resource $2;
        proxy_pass http://$technical_host:$technical_port/technical/$technical_resource;
        proxy_set_header Host $http_host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }
    location /technical/ { return 404; }
    location /mfs/ { try_files $uri =404; }
    location /assets/ { try_files $uri =404; }
    location ~* \.(?:js|css|map|json|woff2?|ttf|png|jpe?g|svg|ico|webp)$ { try_files $uri =404; }
    location = /index.html { add_header Cache-Control 'no-store'; }
    location / { try_files $uri $uri/ /index.html; }
}
