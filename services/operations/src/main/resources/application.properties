spring.application.name=operations
spring.rabbitmq.dynamic=false
spring.rabbitmq.listener.simple.auto-startup=false
server.address=127.0.0.1
server.port=${PORT:8081}
spring.datasource.url=jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:55432}/${DB_NAME:autonexus_operations}?connectTimeout=1&socketTimeout=2&tcpKeepAlive=true
spring.datasource.username=${DB_USER:autonexus_operations}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.connection-timeout=1000
spring.datasource.hikari.validation-timeout=1000
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=0
spring.flyway.enabled=true
spring.flyway.default-schema=public
spring.flyway.locations=classpath:db/migration
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,operationsDatabase
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.status.http-mapping.down=503
management.endpoint.health.status.http-mapping.out-of-service=503
management.health.db.enabled=false
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false
